<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CleanOps Admin Prototype | PandaZen</title>
  <link rel="stylesheet" href="./cleanops.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="CleanOps navigation">
      <a class="brand" href="#home" data-route="home" aria-label="CleanOps home">
        <span class="brand-mark">P</span>
        <span class="brand-name">CleanOps</span>
      </a>

      <button class="nav-create" type="button" data-action="Create new operational record">
        <span class="nav-icon">+</span>
        <span>Create</span>
      </button>

      <nav class="nav-list" id="nav-list"></nav>
    </aside>

    <main class="main-shell">
      <header class="topbar">
        <div class="breadcrumbs">
          <span>PandaZen</span>
          <span>/</span>
          <strong id="breadcrumb-title">Home</strong>
        </div>

        <div class="topbar-actions">
          <label class="search-box">
            <span aria-hidden="true">Search</span>
            <input id="global-search" type="search" placeholder="Client, property, quote">
            <kbd>/</kbd>
          </label>
          <button class="icon-button" type="button" data-action="Open quick actions" aria-label="Quick actions">+</button>
          <button class="icon-button" type="button" data-action="Open notifications" aria-label="Notifications">o</button>
          <button class="icon-button" type="button" data-action="Open help" aria-label="Help">?</button>
          <button class="icon-button" type="button" data-action="Open settings" aria-label="Settings">*</button>
        </div>
      </header>

      <div class="page" id="page-root" aria-live="polite"></div>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <aside class="action-drawer" id="action-drawer" aria-hidden="true">
    <div class="drawer-header">
      <div>
        <p class="eyebrow">Prototype action</p>
        <h2 id="drawer-title">Action</h2>
      </div>
      <button class="icon-button" type="button" id="drawer-close" aria-label="Close drawer">x</button>
    </div>
    <p class="muted" id="drawer-copy"></p>
    <div class="drawer-actions">
      <button class="button primary" type="button" id="drawer-primary">Continue</button>
      <button class="button ghost" type="button" id="drawer-secondary">Keep browsing</button>
    </div>
  </aside>

  <script src="./mock-data.js"></script>
  <script src="./cleanops.js"></script>
</body>
</html>
